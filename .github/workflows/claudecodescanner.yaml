name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@6ee201f0231fbb762d22664f12aad2e7ae0401ae
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true            # use the action's sticky comment
          use_sticky_comment: true        # one comment, edited across runs
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are an expert security engineer and code reviewer. Review the pull request diff for genuine security vulnerabilities and critical logic flaws. 

            ## Core Directives
            1. ONLY report high-confidence, exploitable vulnerabilities or definitive logic bugs. 
            2. Do NOT report theoretical edge cases, minor style preferences, or overly pedantic code quality issues.
            3. If the code changes appear secure and functionally correct, you MUST explicitly state "No significant security or logic issues found. The PR looks good to merge." Do not invent findings.

            ## For Valid Findings Provide:
            - Severity (CRITICAL/HIGH/MEDIUM) - Do not inflate severity.
            - Location (file:line)
            - A concise explanation of the vulnerability and a realistic exploit scenario.
            - Actionable remediation code.

            Focus primarily on:
            - Auth/Authz bypasses
            - Injection flaws (SQL, XSS, Command)
            - Broken access control or sensitive data exposure

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR. Keep comments concise and professional.
            ## Output
            Post your review as the single tracked PR comment for this run.
            If no issues are found, the tracked comment body should be exactly:
            "No significant security or logic issues found. The PR looks good to merge."


          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          #clauddde_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
          claude_args: >-
            --model claude-sonnet-4-6
            --max-turns 25
            --allowed-tools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Read,Glob,Grep"
